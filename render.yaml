services:
  # Backend API Service
  - type: web
    name: ccisched-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --config gunicorn.conf.py wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ccisched-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: AUTO_INIT_DB
        value: true

  # PostgreSQL Database (free tier)
databases:
  - name: ccisched-db
    databaseName: ccisched
    user: ccisched_user
    plan: free
    region: singapore
    # Note: Render's free tier only supports PostgreSQL, not MySQL
